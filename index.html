<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080607"><title>Bó hoa dành tặng bạn 🌸</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#050405;color:#fff}body{overflow:hidden}.stage{height:100dvh;max-width:560px;margin:auto;position:relative;background:#080607;overflow:hidden}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none}.sparkles{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff9c7 1px,transparent 2px),radial-gradient(circle,#fff 1px,transparent 2px);background-size:137px 173px,211px 197px;animation:twinkle 4s ease-in-out infinite alternate;opacity:.55}@keyframes twinkle{to{opacity:.18;transform:translateY(-8px)}}.actions{position:absolute;bottom:0;left:0;right:0;display:flex;gap:12px;justify-content:center;padding:18px 12px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(12,7,7,.97) 24%)}button{font:600 17px system-ui;border:0;border-radius:22px;padding:16px 20px;cursor:pointer;box-shadow:0 4px 14px #0004}.edit{background:#fff7fa;color:#34232a}.card{background:#e85b8c;color:white}.modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:22px}.modal.show{display:flex}.panel{background:#fff8fb;color:#30222a;border-radius:24px;padding:24px;width:100%;max-width:390px;box-shadow:0 12px 40px #0008}.panel h2{margin:0 0 14px;font-size:23px}.panel p{line-height:1.5}.panel input,.panel textarea{display:block;width:100%;margin:10px 0;padding:12px;border:1px solid #e8c9d5;border-radius:12px;font:16px system-ui}.panel textarea{min-height:100px;resize:vertical}.panel .primary{background:#e85b8c;color:#fff;width:100%;margin-top:6px}.panel .secondary{background:#eee;color:#333;width:100%;margin-top:8px}.preview{white-space:pre-wrap;line-height:1.6;font-family:Georgia,serif;color:#a42e5d}.small{font-size:12px;color:#76636c;text-align:center;margin-top:12px}
</style></head><body><main class="stage"><img class="art" src="assets/bouquet.jpg" alt="Bó hoa hồng màu hồng trên nền đen lấp lánh"><div class="sparkles"></div><div class="actions"><button class="edit" id="edit">← Chỉnh sửa</button><button class="card" id="make">Tạo thiệp →</button></div><section class="modal" id="editor" aria-modal="true" role="dialog"><div class="panel"><h2>🌷 Chỉnh sửa bó hoa</h2><p>Thêm lời nhắn của bạn. Ảnh bó hoa gốc vẫn được giữ nguyên.</p><input id="to" placeholder="Gửi tặng (ví dụ: Bạn thân)" maxlength="60"><textarea id="message" placeholder="Viết lời chúc của bạn..." maxlength="500">Mong bạn luôn vui vẻ, rực rỡ và được yêu thương như những bông hoa này 🌸</textarea><button class="primary" id="save">Lưu lời nhắn</button><button class="secondary close">Đóng</button><div class="small">Bản demo lưu lời nhắn trong phiên hiện tại.</div></div></section><section class="modal" id="greeting" aria-modal="true" role="dialog"><div class="panel"><h2>💌 Một tấm thiệp nhỏ</h2><p id="recipient"></p><div class="preview" id="preview"></div><button class="primary" id="share">Chia sẻ thiệp</button><button class="secondary close">Quay lại</button></div></section></main><script>
const $=id=>document.getElementById(id);let savedMessage=$('message').value,savedTo='';$('edit').onclick=()=>$('editor').classList.add('show');$('make').onclick=()=>{render();$('greeting').classList.add('show')};document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('show'));$('save').onclick=()=>{savedMessage=$('message').value.trim()||'Chúc bạn luôn vui vẻ 🌸';savedTo=$('to').value.trim();$('editor').classList.remove('show');render()};function render(){$('recipient').textContent=savedTo?'Gửi tặng '+savedTo+' 💗':'Gửi tặng bạn 💗';$('preview').textContent=savedMessage} $('share').onclick=async()=>{const text=($('recipient').textContent+'\n\n'+$('preview').textContent);if(navigator.share){try{await navigator.share({title:'Một tấm thiệp nhỏ 🌸',text})}catch(e){}}else{try{await navigator.clipboard.writeText(text);$('share').textContent='Đã sao chép lời chúc ✓'}catch(e){$('share').textContent='Hãy sao chép lời chúc thủ công'}}};
</script></body></html>
